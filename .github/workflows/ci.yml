name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::914875350889:role/inventory-management-github-actions-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 914875350889.dkr.ecr.ap-northeast-2.amazonaws.com
          ECR_REPOSITORY: inventory-management
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ap-northeast-2 \
            --instance-ids "i-00b1969a28e62522b" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 914875350889.dkr.ecr.ap-northeast-2.amazonaws.com",
              "docker pull 914875350889.dkr.ecr.ap-northeast-2.amazonaws.com/inventory-management:latest",
              "docker rm -f inventory-app || true"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --region ap-northeast-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "i-00b1969a28e62522b"

          aws ssm get-command-invocation \
            --region ap-northeast-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "i-00b1969a28e62522b"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
